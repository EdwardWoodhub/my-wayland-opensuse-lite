name: Build Elemental OS Image and ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OCI_IMAGE_NAME: my-wayland-opensuse-lite-vm
  ISO_NAME: my-wayland-opensuse-lite-iso

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用户名转小写以避免 GHCR 命名规范校验失败
      - name: Resolve Full Image Name
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${ACTOR_LOWER}/${{ env.OCI_IMAGE_NAME }}" >> $GITHUB_ENV

      # 1. 构建并推送 OCI 操作系统镜像
      - name: Build and push OS Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ env.FULL_IMAGE_NAME }}:latest
          build-args: |
            REPO=${{ env.FULL_IMAGE_NAME }}
            VERSION=latest

      # 2. 调用 elemental-cli 将刚推送的镜像打包为可引导 ISO
      - name: Build Bootable ISO
        run: |
          mkdir -p build-output
          docker run --rm -v $(pwd)/build-output:/build \
            ghcr.io/rancher/elemental-toolkit/elemental-cli:latest \
            --debug build-iso \
            --name ${{ env.ISO_NAME }} \
            --bootloader-in-rootfs \
            -o /build \
            docker:${{ env.FULL_IMAGE_NAME }}:latest

      # 3. 保存生成的 ISO 安装介质
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: build-output/${{ env.ISO_NAME }}.iso
          retention-days: 7
