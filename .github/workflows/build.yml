name: Build LXQt OS Based On openSUSE and Publish ISO

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'              # 忽略仓库内所有目录下的 Markdown 文件修改
      - 'LICENSE'            # 忽略开源协议文件变更
      - '.gitignore'         # 忽略 gitignore 修改
      - 'docs/**'            # 忽略纯文档目录
  schedule:
    # 每天 UTC 19:03 (北京时间次日凌晨 3:03) 定时触发
    - cron: '03 19 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OCI_IMAGE_NAME: my-wayland-opensuse-lite-vm
  ISO_BASE_NAME: my-wayland-opensuse-lite-iso

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # 创建 Release 及上传大文件附件必需权限
      packages: write       # 推送 GHCR 容器镜像必需权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 动态生成唯一的 Tag、版本号与 ISO 文件名
      - name: Generate Build Metadata
        id: meta
        run: |
          DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            RELEASE_TAG="nightly-${DATE_TAG}"
            RELEASE_TITLE="Nightly Build (${DATE_TAG})"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="manual-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Manual Build (${DATE_TAG}-${SHORT_SHA})"
          else
            RELEASE_TAG="commit-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Commit Build (${DATE_TAG}-${SHORT_SHA})"
          fi

          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')

          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${ACTOR_LOWER}/${{ env.OCI_IMAGE_NAME }}" >> $GITHUB_ENV
          echo "CURRENT_ISO_NAME=${{ env.ISO_BASE_NAME }}-${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 构建并推送不可变 OCI 操作系统镜像
      - name: Build and push OS Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.FULL_IMAGE_NAME }}:latest
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          build-args: |
            REPO=${{ env.FULL_IMAGE_NAME }}
            VERSION=${{ env.RELEASE_TAG }}

      # 3. 打包 ISO、检测体积并在超过 1.5GB 时执行自动分卷切割
      - name: Build Bootable ISO and Split if Exceeds 1.5GB
        run: |
          mkdir -p build-output release-assets
          
          # 打包完整 ISO
          docker run --rm -v $(pwd)/build-output:/build \
            ghcr.io/rancher/elemental-toolkit/elemental-cli:latest \
            --debug build-iso \
            --name ${{ env.CURRENT_ISO_NAME }} \
            --bootloader-in-rootfs \
            -o /build \
            docker:${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}

          ISO_PATH="build-output/${{ env.CURRENT_ISO_NAME }}.iso"
          
          # 计算 ISO 真实字节大小与阈值 (1.5GB = 1572864000 字节)
          FILE_SIZE=$(stat -c%s "${ISO_PATH}")
          MAX_SIZE=1572864000
          
          cd build-output
          # 先对原始完整 ISO 生成标准 SHA256 校验和
          sha256sum "${{ env.CURRENT_ISO_NAME }}.iso" > "../release-assets/${{ env.CURRENT_ISO_NAME }}.iso.sha256"

          if [ "${FILE_SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "ISO file size (${FILE_SIZE} bytes) exceeds 1.5GB. Splitting into 1500M parts..."
            split -b 1500M -d -a 2 "${{ env.CURRENT_ISO_NAME }}.iso" "${{ env.CURRENT_ISO_NAME }}.iso.part"
            
            # 移动切片文件到发布目录并生成各切片的校验和
            mv ${{ env.CURRENT_ISO_NAME }}.iso.part* ../release-assets/
            cd ../release-assets
            sha256sum ${{ env.CURRENT_ISO_NAME }}.iso.part* >> "${{ env.CURRENT_ISO_NAME }}.iso.sha256"
            echo "IS_SPLIT=true" >> $GITHUB_ENV
          else
            echo "ISO file size (${FILE_SIZE} bytes) is within 1.5GB. Uploading intact ISO..."
            mv "${{ env.CURRENT_ISO_NAME }}.iso" ../release-assets/
            echo "IS_SPLIT=false" >> $GITHUB_ENV
          fi

      # 4. 发布独立的 GitHub Release（保留全部历史记录，不作删除）
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ### Elemental OS Image Release
            - **Event:** `${{ github.event_name }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **OCI Image (Latest):** `${{ env.FULL_IMAGE_NAME }}:latest`
            - **OCI Image (Immutable Tag):** `${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}`
            - **Split Files:** `${{ env.IS_SPLIT }}`

            ${{ env.IS_SPLIT == 'true' && format('#### 拼接 ISO 命令：
            ```bash
            # Linux / macOS
            cat {0}.iso.part* > {0}.iso
            sha256sum -c {0}.iso.sha256

            # Windows (CMD)
            copy /b {0}.iso.part* {0}.iso
            ```', env.CURRENT_ISO_NAME) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 5. 末尾：登录并同步镜像到阿里云 ACR
      # =========================================================================
      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.vars.outputs.image_name }}
          TARGET_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: |
          set -e
          # 检查必要密钥是否配置
          if [ -z "$ACR_REGISTRY" ] || [ -z "$ACR_NAMESPACE" ]; then
            echo "Error: ALIYUN_ACR_REGISTRY or ALIYUN_ACR_NAMESPACE secret is not set!"
            exit 1
          fi

          GHCR_TAG_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          ALIYUN_TAG_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${TARGET_NAME}:${IMAGE_TAG}"
          ALIYUN_LATEST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${TARGET_NAME}:latest"

          # 如果本地没有该镜像标签（例如多 job 场景），则尝试 pull 一次兜底
          if ! docker image inspect "$GHCR_TAG_IMAGE" >/dev/null 2>&1; then
            echo "Local image not found, pulling $GHCR_TAG_IMAGE ..."
            docker pull "$GHCR_TAG_IMAGE"
          fi

          echo "Tagging images for Aliyun ACR ..."
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_TAG_IMAGE"
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_LATEST_IMAGE"

          echo "Pushing to Aliyun ACR ..."
          docker push "$ALIYUN_TAG_IMAGE"
          docker push "$ALIYUN_LATEST_IMAGE"
      
      
